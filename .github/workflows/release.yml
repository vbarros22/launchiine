name: Release

# Run it from the Actions tab (Release -> Run workflow -> version, e.g. v0.2) or push a
# tag like v0.2. It builds men.rpx, creates the tag if needed and publishes a release with
# - men.rpx
# - launchiine-<tag>.zip, laid out like the SD card (wiiu/environments/aroma/men.rpx)
# The release text is taken from release-notes.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.2"
        required: true
        default: "v0.2"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build men.rpx
        run: |
          docker build . -t builder
          docker run --rm -v ${PWD}:/project builder make
      - name: Package
        run: |
          mkdir -p sd/wiiu/environments/aroma
          cp men.rpx sd/wiiu/environments/aroma/men.rpx
          (cd sd && zip -r ../launchiine-${TAG}.zip wiiu)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: launchiine ${{ env.TAG }}
          body_path: release-notes.md
          prerelease: true
          files: |
            men.rpx
            launchiine-${{ env.TAG }}.zip
